# 아침 작업 흐름: 수집 → 글 화면·미리보기 생성 → 저장소에 기록 → 넷리파이에 올리기 → 색인 알림
name: 아침 수집과 올리기
on:
  schedule:
    - cron: '17 21 * * *'   # 한국 시간 06:17
  workflow_dispatch:
    inputs:
      force: { description: '파일 자료 다시 받기(아무 값)', required: false }
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: daily
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      WIPAN_FORCE: ${{ github.event.inputs.force }}
      FILES_FORCE: ${{ github.event.inputs.force }}
      FOODSAFETY_KEY: ${{ secrets.FOODSAFETY_KEY }}
      MAFRA_KEY: ${{ secrets.MAFRA_KEY }}
      KAMIS_KEY: ${{ secrets.KAMIS_KEY }}
      KAMIS_ID: ${{ secrets.KAMIS_ID }}
      ECOS_KEY: ${{ secrets.ECOS_KEY }}
      OPINET_KEY: ${{ secrets.OPINET_KEY }}
      KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
      USDA_KEY: ${{ secrets.USDA_KEY }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      GA_ID: ${{ secrets.GA_ID }}
      NAVER_SITE_VERIFICATION: ${{ secrets.NAVER_SITE_VERIFICATION }}
      KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
      SAFETYDATA_KEY: ${{ secrets.SAFETYDATA_KEY }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow pyproj
      - name: 경락가 수집(축산물품질평가원)
        run: python tools/collect_ekape.py
      - name: 양식 접수 반영(공동구매 모집판·구입가 시세판)
        run: python tools/sync_forms.py
      - name: 수협 산지 위판 시세(해양수산부 위탁판매 현황 파일, 열쇠 불필요)
        run: python tools/collect_wipan.py
      - name: 파일데이터 일괄(열쇠 불필요 — 사료값·수입가·부분육·도축·재고 등)
        run: pip install -q openpyxl && python tools/collect_files.py && python tools/build_files.py
        timeout-minutes: 15
        continue-on-error: true
      - name: 공공데이터포털 밖 제공처(농산물유통정보·환율·기름값·국가통계·미국 농무부)
        run: python tools/collect_extra.py
      - name: 이상 신호(고수온·급등락·전염병)
        run: python tools/collect_signals.py
      - name: 수급 위험 예보(7일 수온·기온·습도 → 양식 폐사·가축 더위 위험, 열쇠 불필요)
        run: python tools/collect_risk.py
      - name: 구매 신호(품목별 값 방향·적중 채점)
        run: python tools/build_signal.py
      - name: 수급 기회(산지 값 차이·공급 넘침·빠듯·어족)
        run: python tools/build_opps.py
      - name: 자가 점검(재기·찾기)
        run: python tools/self_check.py
        continue-on-error: true
      - name: 글 화면·사이트 지도·새 소식
        run: python tools/build_pages.py
      - name: 미리보기 그림
        run: python tools/og.py
      - name: 저장소에 기록
        run: |
          git config user.name "박씨팜 아침 작업"
          git config user.email "bot@bakssifarm.local"
          git add -A site/data site/index.html tools/urls.txt private || true
          git diff --cached --quiet || git commit -m "아침 수집 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git checkout -- . 2>/dev/null; git clean -fdq -e _korea 2>/dev/null; for i in 1 2 3 4 5; do git pull --rebase -X theirs -q && git push && break; git rebase --abort 2>/dev/null; sleep 7; done || true
      - name: 넷리파이에도 올리기(토큰이 있을 때만)
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != '' }}
        run: npx --yes netlify-cli@17 deploy --prod --dir=site --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="아침 올리기 $(TZ=Asia/Seoul date +%Y-%m-%d)"
      - name: 색인 알림
        run: python tools/indexnow.py
  pages:
    needs: build
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
